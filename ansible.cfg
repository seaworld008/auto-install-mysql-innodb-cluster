[defaults]
inventory = inventory/hosts.yml
host_key_checking = True
timeout = 30
gathering = smart
fact_caching = memory
stdout_callback = ansible.builtin.default
callback_result_format = yaml
bin_ansible_callbacks = True
ask_pass = False
remote_user = root

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

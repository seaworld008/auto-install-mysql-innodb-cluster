# 仅拓扑示例；复制到 inventory/hosts.local.yml 后修改文档地址。
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: auto_silent
  hosts:
    db1:
      ansible_host: 192.0.2.11
      mysql_server_id: 1
    db2:
      ansible_host: 192.0.2.12
      mysql_server_id: 2
    db3:
      ansible_host: 192.0.2.13
      mysql_server_id: 3
    lb1:
      ansible_host: 192.0.2.31
      keepalived_priority: 150
    lb2:
      ansible_host: 192.0.2.32
      keepalived_priority: 120
  children:
    mysql_cluster:
      children:
        mysql_primary:
          hosts:
            db1: {}
        mysql_secondary:
          hosts:
            db2: {}
            db3: {}
    mysql_router:
      hosts:
        db1: {}
        db2: {}
    haproxy_lb:
      hosts:
        lb1: {}
        lb2: {}

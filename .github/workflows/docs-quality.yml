name: docs-quality

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - ".markdownlint-cli2.yaml"
      - ".yamllint.yml"
      - ".github/workflows/docs-quality.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - ".markdownlint-cli2.yaml"
      - ".yamllint.yml"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Markdown and YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install YAML lint
        run: python -m pip install "yamllint>=1.37.0,<2.0.0"

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.2

      - name: YAML lint
        shell: bash
        run: |
          mapfile -d '' yaml_files < <(git ls-files -z "*.yml" "*.yaml")
          if (( ${#yaml_files[@]} == 0 )); then
            echo "No tracked YAML files found" >&2
            exit 1
          fi
          yamllint "${yaml_files[@]}"

---
- name: 安装和配置MySQL Router
  any_errors_fatal: true
  hosts: mysql_router
  become: yes
  gather_facts: yes
  serial: 1
  vars:
    mysql_router_service_name: "mysqlrouter"
    mysql_router_package_name_redhat: "mysql-router-community"
    mysql_router_package_name_debian: "mysql-router"
    mysql_router_bootstrap_host: >-
      {{
        hostvars[groups['mysql_primary'][0]].ansible_host
        | default(groups['mysql_primary'][0])
      }}
    mysql_release_apt_components: "{{ 'mysql-8.0 mysql-tools' if mysql_release_line == '8.0' else 'mysql-8.4-lts mysql-tools' }}"
    mysql_release_yum_server_repo_name: "{{ 'mysql80-community' if mysql_release_line == '8.0' else 'mysql-84-lts-community' }}"
    mysql_release_yum_server_baseurl: "{{ 'https://repo.mysql.com/yum/mysql-8.0-community/el/' ~ ansible_distribution_major_version ~ '/$basearch/' if mysql_release_line == '8.0' else 'https://repo.mysql.com/yum/mysql-8.4-community/el/' ~ ansible_distribution_major_version ~ '/$basearch/' }}"
    mysql_release_yum_tools_repo_name: "{{ 'mysql-tools-community' if mysql_release_line == '8.0' else 'mysql-tools-84-lts-community' }}"
    mysql_release_yum_tools_baseurl: "{{ 'https://repo.mysql.com/yum/mysql-tools-community/el/' ~ ansible_distribution_major_version ~ '/$basearch/' if mysql_release_line == '8.0' else 'https://repo.mysql.com/yum/mysql-tools-8.4-community/el/' ~ ansible_distribution_major_version ~ '/$basearch/' }}"
    mysql_router_packages_redhat:
      - wget
      - "{{ 'curl-minimal' if 'curl-minimal' in ansible_facts.packages else 'curl' }}"
      - "{{ 'python39' if ansible_distribution_major_version == '8' else 'python3' }}"
    mysql_router_packages_debian:
      - wget
      - curl
      - gnupg
      - python3
    mysql_router_managed_settings:
      cluster_name: "{{ mysql_cluster_name }}"
      max_total_connections: "{{ mysql_router_max_total_connections }}"
      max_idle_server_connections: "{{ mysql_router_max_idle_server_connections }}"
      metadata_read_timeout: "{{ mysql_router_metadata_read_timeout }}"
      metadata_connect_timeout: "{{ mysql_router_metadata_connect_timeout }}"
      rw_port: "{{ mysql_router_port }}"
      ro_port: "{{ mysql_router_ro_port }}"
      split_port: "{{ mysql_router_rwsplit_port }}"
      admin_port: "{{ mysql_router_admin_port }}"
      rw_strategy: "{{ mysql_router_4c8g_optimized.routing_strategy_rw }}"
      ro_strategy: "{{ mysql_router_4c8g_optimized.routing_strategy_ro }}"
      split_strategy: "{{ mysql_router_4c8g_optimized.routing_strategy_rwsplit }}"
      routing:
        max_connections: "{{ mysql_router_route_max_connections }}"
        max_connect_errors: "{{ mysql_router_max_connect_errors }}"
        client_connect_timeout: "{{ mysql_router_client_connect_timeout }}"
        connect_timeout: "{{ mysql_router_routing_connect_timeout }}"
  tasks:
    - name: 验证目标操作系统受支持
      assert:
        that:
          - mysql_release_line in mysql_supported_release_lines
          - >
            (ansible_os_family == 'RedHat' and ansible_distribution_major_version in mysql_supported_redhat_major_versions)
            or
            (ansible_distribution == 'Ubuntu' and ansible_distribution_release in mysql_supported_ubuntu_releases)
            or
            (ansible_distribution == 'Debian' and ansible_distribution_release in mysql_supported_debian_releases)
        fail_msg: "目标系统或 MySQL 发行线不在支持配置列表中，请核对 mysql_supported_*；真实环境兼容性须另行验收。"
        success_msg: "目标操作系统在支持配置列表内"

    - name: 验证 Router 文件句柄目标
      ansible.builtin.assert:
        that:
          - mysql_router_nofile_limit | string is match('^[1-9][0-9]*$')
          - mysql_router_nofile_limit | int > 0
          - mysql_router_max_total_connections | string is match('^[1-9][0-9]*$')
          - mysql_router_max_total_connections | int > 0
          - >-
            mysql_router_nofile_limit | int >=
            3 * (mysql_router_max_total_connections | int) + (mysql_router_max_idle_server_connections | int) + 1024
        fail_msg: "mysql_router_nofile_limit 必须是正整数。"

    - name: 读取 Router 文件句柄内核上限
      ansible.builtin.command:
        argv: [cat, "/proc/sys/{{ item | replace('.', '/') }}"]
      loop: [fs.nr_open, fs.file-max]
      register: mysqlrouter_kernel_file_limits
      changed_when: false

    - name: 要求内核支持 Router 文件句柄目标
      ansible.builtin.assert:
        that:
          - item.stdout | int >= mysql_router_nofile_limit | int
        fail_msg: "{{ item.item }} 小于 mysql_router_nofile_limit；请先调整主机内核上限。"
      loop: "{{ mysqlrouter_kernel_file_limits.results }}"

    - name: 检查已有 RPM 包以保留 curl 提供者
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_os_family == 'RedHat'

    - name: 安装 Router 依赖和软件包（RedHat）
      package:
        name: "{{ mysql_router_packages_redhat }}"
        state: present
      when: ansible_os_family == 'RedHat'

    - name: 创建 MySQL 仓库密钥目录
      ansible.builtin.file:
        path: /etc/mysql-repo-keys
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 下载并校验 MySQL 仓库密钥
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ item.path }}"
        checksum: "sha256:{{ item.sha256 }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ mysql_repo_gpg_keys }}"

    - name: 配置 MySQL YUM 仓库（RedHat）
      yum_repository:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        baseurl: "{{ item.baseurl }}"
        enabled: yes
        gpgcheck: yes
        repo_gpgcheck: no
        gpgkey: "{{ mysql_repo_gpg_keys | map(attribute='file_url') | list }}"
      loop:
        - name: "{{ mysql_release_yum_server_repo_name }}"
          description: MySQL {{ mysql_repo_series }} Router
          baseurl: "{{ mysql_release_yum_server_baseurl }}"
        - name: "{{ mysql_release_yum_tools_repo_name }}"
          description: MySQL {{ mysql_repo_series }} Tools
          baseurl: "{{ mysql_release_yum_tools_baseurl }}"
      when: ansible_os_family == 'RedHat'

    - name: 禁用 RedHat 系统自带 MySQL 模块
      command: "dnf -y module disable mysql"
      when: ansible_os_family == 'RedHat'
      register: dnf_module_disable
      changed_when: "'Nothing to do.' not in (dnf_module_disable.stdout | default(''))"
      failed_when: false

    - name: 配置 MySQL APT 仓库
      copy:
        dest: /etc/apt/sources.list.d/mysql.list
        mode: '0644'
        content: |
          deb [signed-by={{ mysql_repo_gpg_keys[-1].path }}] https://repo.mysql.com/apt/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} {{ mysql_release_apt_components }}
      when: ansible_os_family == 'Debian'

    - name: 更新 APT 缓存
      apt:
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: 安装 Router 依赖和软件包（Debian/Ubuntu）
      apt:
        name: "{{ mysql_router_packages_debian + [mysql_router_package_name_debian, 'mysql-shell'] }}"
        state: present
        update_cache: no
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: ansible_os_family == 'Debian'

    - name: 安装 MySQL Router（RedHat）
      package:
        name: "{{ [mysql_router_package_name_redhat, 'mysql-shell'] }}"
        state: present
      when: ansible_os_family == 'RedHat'

    - name: 创建MySQL Router配置目录
      file:
        path: /etc/mysqlrouter
        state: directory
        owner: mysqlrouter
        group: mysqlrouter
        mode: '0755'

    - name: 创建MySQL Router日志目录
      file:
        path: /var/log/mysqlrouter
        state: directory
        owner: mysqlrouter
        group: mysqlrouter
        mode: '0755'

    - name: 创建MySQL Router数据目录
      file:
        path: /var/lib/mysqlrouter
        state: directory
        owner: mysqlrouter
        group: mysqlrouter
        mode: '0755'

    - name: 检查 Router 是否已完成 bootstrap
      stat:
        path: /var/lib/mysqlrouter/mysqlrouter.conf
      register: mysqlrouter_bootstrap_conf

    - name: Bootstrap MySQL Router
      ansible.builtin.command:
        argv:
          - mysqlrouter
          - "--bootstrap={{ mysql_cluster_user }}@{{ mysql_router_bootstrap_host }}:{{ mysql_port }}"
          - --directory
          - /var/lib/mysqlrouter
          - "--name={{ inventory_hostname }}"
          - "--conf-base-port={{ mysql_router_port }}"
          - --conf-use-sockets
          - "--conf-set-option=DEFAULT.max_idle_server_connections={{ mysql_router_max_idle_server_connections }}"
          - "--conf-set-option=DEFAULT.max_total_connections={{ mysql_router_max_total_connections }}"
          - "--conf-set-option=DEFAULT.read_timeout={{ mysql_router_metadata_read_timeout }}"
          - "--conf-set-option=DEFAULT.connect_timeout={{ mysql_router_metadata_connect_timeout }}"
          - "--conf-set-option=routing:bootstrap_rw_split.bind_port={{ mysql_router_rwsplit_port }}"
          - >-
            --conf-set-option=routing:bootstrap_rw_split.destinations=metadata-cache://
            {{- mysql_cluster_name -}}/default?role=PRIMARY_AND_SECONDARY
          - >-
            --conf-set-option=routing:bootstrap_rw_split.routing_strategy=
            {{- mysql_router_4c8g_optimized.routing_strategy_rwsplit }}
          - "--conf-set-option=routing:bootstrap_rw_split.access_mode=auto"
          - "--conf-set-option=routing:bootstrap_rw_split.connection_sharing=1"
          - "--conf-set-option=routing:bootstrap_rw_split.protocol=classic"
          - --strict
          - --force
        stdin: "{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      register: router_bootstrap
      become_user: mysqlrouter
      when: mysql_router_rebootstrap | bool or not mysqlrouter_bootstrap_conf.stat.exists
      no_log: true

    - name: 读取 bootstrap 配置并保留 Router 身份
      ansible.builtin.slurp:
        src: /var/lib/mysqlrouter/mysqlrouter.conf
      register: mysqlrouter_current_config
      no_log: true

    - name: 原子更新 Router 受管选项
      ansible.builtin.copy:
        dest: /var/lib/mysqlrouter/mysqlrouter.conf
        content: >-
          {{ mysqlrouter_current_config.content | b64decode
             | mysql_router_config(mysql_router_managed_settings) }}
        owner: mysqlrouter
        group: mysqlrouter
        mode: '0600'
      register: mysqlrouter_config_update
      no_log: true

    - name: 显示 Router bootstrap 结果
      ansible.builtin.debug:
        msg: >-
          MySQL Router bootstrap
          {{ '已执行' if router_bootstrap is changed else '未执行（已有配置）' }}。

    - name: 创建MySQL Router systemd服务文件
      template:
        src: ../roles/mysql-router/templates/mysqlrouter.service.j2
        dest: /etc/systemd/system/mysqlrouter.service
        owner: root
        group: root
        mode: '0644'
      register: mysqlrouter_service_update

    - name: 加载 Router systemd 配置
      ansible.builtin.systemd_service:
        daemon_reload: true
      changed_when: false

    - name: 读取 systemd 解析后的 Router 文件句柄上限
      ansible.builtin.command:
        argv: [systemctl, show, "{{ mysql_router_service_name }}", -p, LimitNOFILE, --value]
      register: mysqlrouter_systemd_nofile
      changed_when: false

    - name: 读取 systemd 解析后的 Router 文件句柄软限制
      ansible.builtin.command:
        argv: [systemctl, show, "{{ mysql_router_service_name }}", -p, LimitNOFILESoft, --value]
      register: mysqlrouter_systemd_nofile_soft
      changed_when: false

    - name: 在重启前拒绝冲突的 systemd 文件句柄配置
      ansible.builtin.assert:
        that:
          - mysqlrouter_systemd_nofile.stdout is match('^[1-9][0-9]*$')
          - mysqlrouter_systemd_nofile.stdout | int >= mysql_router_nofile_limit | int
          - mysqlrouter_systemd_nofile.stdout | int <= mysqlrouter_kernel_file_limits.results[0].stdout | int
          - mysqlrouter_systemd_nofile_soft.stdout is match('^[1-9][0-9]*$')
          - mysqlrouter_systemd_nofile_soft.stdout | int >= mysql_router_nofile_limit | int
          - mysqlrouter_systemd_nofile_soft.stdout | int <= mysqlrouter_systemd_nofile.stdout | int
        fail_msg: "systemd 的 LimitNOFILE 与目标或内核上限冲突，请检查该 Router 服务的其他 drop-in。"

    - name: 读取配置应用前的 Router 主进程
      ansible.builtin.command:
        argv: [systemctl, show, "{{ mysql_router_service_name }}", -p, MainPID, --value]
      register: mysqlrouter_pre_restart_pid
      changed_when: false
      failed_when: mysqlrouter_pre_restart_pid.rc != 0 or not (mysqlrouter_pre_restart_pid.stdout is match('^[0-9]+$'))

    - name: 读取已有 Router 进程的文件句柄容量
      ansible.builtin.slurp:
        src: "/proc/{{ mysqlrouter_pre_restart_pid.stdout }}/limits"
      register: mysqlrouter_pre_restart_limits
      when: mysqlrouter_pre_restart_pid.stdout | int > 0

    - name: 解析已有 Router 进程的文件句柄容量
      ansible.builtin.set_fact:
        mysqlrouter_running_nofile: >-
          {{ mysqlrouter_pre_restart_limits.content | default('') | b64decode
             | regex_findall('(?m)^Max open files\s+(\d+)\s+(\d+)') }}

    - name: 要求已有 Router 进程限制可验证
      ansible.builtin.assert:
        that: mysqlrouter_running_nofile | length == 1
        fail_msg: "无法读取已有 mysqlrouter 进程的文件句柄容量。"
      when: mysqlrouter_pre_restart_pid.stdout | int > 0

    - name: 计算 Router 重启需求
      ansible.builtin.set_fact:
        mysqlrouter_needs_restart: >-
          {{ mysqlrouter_pre_restart_pid.stdout | int > 0 and
             (mysqlrouter_running_nofile[0][0] | int != mysqlrouter_systemd_nofile_soft.stdout | int
              or mysqlrouter_running_nofile[0][1] | int != mysqlrouter_systemd_nofile.stdout | int) }}

    - name: 收集系统服务状态（RedHat）
      ansible.builtin.service_facts:
      when: ansible_os_family == 'RedHat'

    - name: 配置防火墙规则（firewalld 运行时）
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - "{{ mysql_router_port }}/tcp"
        - "{{ mysql_router_ro_port }}/tcp"
        - "{{ mysql_router_rwsplit_port }}/tcp"
        - "{{ mysql_router_admin_port }}/tcp"
      when:
        - ansible_os_family == 'RedHat'
        - "'firewalld.service' in ansible_facts.services"
        - ansible_facts.services['firewalld.service'].state == 'running'

    - name: 启动并启用MySQL Router服务
      systemd:
        name: "{{ mysql_router_service_name }}"
        state: "{{ 'restarted' if router_bootstrap is changed or mysqlrouter_config_update is changed or mysqlrouter_service_update is changed or mysqlrouter_needs_restart | bool else 'started' }}"
        enabled: yes
        daemon_reload: yes

    - name: 等待MySQL Router启动
      wait_for:
        port: "{{ mysql_router_port }}"
        host: "{{ ansible_default_ipv4.address }}"
        delay: 5
        timeout: 60

    - name: 读取运行中的 Router 主进程
      ansible.builtin.command:
        argv: [systemctl, show, "{{ mysql_router_service_name }}", -p, MainPID, --value]
      register: mysqlrouter_main_pid
      changed_when: false
      failed_when: mysqlrouter_main_pid.rc != 0 or not (mysqlrouter_main_pid.stdout is match('^[1-9][0-9]*$'))

    - name: 读取 Router 进程实际资源限制
      ansible.builtin.slurp:
        src: "/proc/{{ mysqlrouter_main_pid.stdout }}/limits"
      register: mysqlrouter_process_limits

    - name: 核对 Router 实际文件句柄容量
      ansible.builtin.assert:
        that:
          - mysqlrouter_actual_nofile | length == 1
          - mysqlrouter_actual_nofile[0][0] | int == mysqlrouter_systemd_nofile_soft.stdout | int
          - mysqlrouter_actual_nofile[0][1] | int == mysqlrouter_systemd_nofile.stdout | int
        fail_msg: "mysqlrouter 进程的实际文件句柄限制与 systemd 配置不一致。"
      vars:
        mysqlrouter_actual_nofile: >-
          {{ mysqlrouter_process_limits.content | b64decode
             | regex_findall('(?m)^Max open files\s+(\d+)\s+(\d+)') }}

    - name: 测试 MySQL Router 读写端口
      ansible.builtin.command:
        argv:
          - mysqlsh
          - --no-defaults
          - --passwords-from-stdin
          - --password
          - --uri
          - "{{ mysql_cluster_user }}@127.0.0.1:{{ mysql_router_port }}"
          - --sql
          - -e
          - "SELECT @@hostname, @@port"
        stdin: "{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      register: router_rw_test
      changed_when: false
      no_log: true

    - name: 测试 MySQL Router 只读端口
      ansible.builtin.command:
        argv:
          - mysqlsh
          - --no-defaults
          - --passwords-from-stdin
          - --password
          - --uri
          - "{{ mysql_cluster_user }}@127.0.0.1:{{ mysql_router_ro_port }}"
          - --sql
          - -e
          - "SELECT @@hostname, @@port, @@read_only"
        stdin: "{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      register: router_ro_test
      changed_when: false
      no_log: true

    - name: 测试 MySQL Router 自动读写分离端口
      ansible.builtin.command:
        argv:
          - mysqlsh
          - --no-defaults
          - --passwords-from-stdin
          - --password
          - --uri
          - "{{ mysql_cluster_user }}@127.0.0.1:{{ mysql_router_rwsplit_port }}"
          - --sql
          - -e
          - "SELECT @@hostname, @@port"
        stdin: "{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      register: router_rwsplit_test
      changed_when: false
      no_log: true

    - name: 显示 Router 连接测试结果
      ansible.builtin.debug:
        msg: "Router RW、RO 与 R/W Split 三个端口连接测试均通过。"

    - name: MySQL Router安装完成提示
      debug:
        msg: |
          MySQL Router 安装配置完成！

          连接信息:
          - Router地址: {{ ansible_default_ipv4.address }}
          - 读写端口: {{ mysql_router_port }}
          - 只读端口: {{ mysql_router_ro_port }}
          - 自动读写分离端口: {{ mysql_router_rwsplit_port }}
          - 管理端口: {{ mysql_router_admin_port }}

          应用连接示例:
          mysql -h {{ ansible_default_ipv4.address }} -P {{ mysql_router_port }} -u your_user -p

          Router状态检查:
          systemctl status {{ mysql_router_service_name }}

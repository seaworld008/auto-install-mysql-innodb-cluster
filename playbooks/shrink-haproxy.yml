---
- name: HAProxy/Keepalived 节点缩容说明
  hosts: localhost
  gather_facts: false
  tasks:
    - debug:
        msg: |
          将对 --limit 指定的 haproxy_lb 节点执行：
          1. 停止并禁用 keepalived
          2. 停止并禁用 haproxy
          3. 完成后请从 inventory 的 haproxy_lb 组移除该主机

- name: HAProxy/Keepalived 节点缩容执行
  hosts: haproxy_lb
  gather_facts: true
  become: yes
  tasks:
    - name: 要求缩容精确匹配一台 LB 且保留最小节点数
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - (groups['haproxy_lb'] | length - 1) >= (haproxy_ha_min_nodes | int)
        fail_msg: >-
          LB 缩容必须精确匹配一台主机，且缩容后不得低于
          haproxy_ha_min_nodes。
      run_once: true

    - name: 停止 Keepalived
      systemd:
        name: keepalived
        state: stopped
        enabled: no

    - name: 停止 HAProxy
      systemd:
        name: haproxy
        state: stopped
        enabled: no

    - name: 输出缩容提示
      debug:
        msg: "HAProxy 节点 {{ inventory_hostname }} 已停服，请从 inventory 中移除后再执行健康检查。"

---
# MySQL Linux 主机内核配置与运行值验证

- name: MySQL Linux 内核配置与验证
  any_errors_fatal: true
  hosts: all
  become: yes
  gather_facts: yes
  vars_files:
    - ../inventory/group_vars/all.yml
  
  vars:
    # 脚本版本和优化级别
    script_version: "2.0-stable"
    optimization_level: "production"
    
    # 备份目录
    backup_timestamp: "{{ ansible_date_time.epoch }}"
    backup_dir: "{{ mysql_kernel_backup_root }}/{{ backup_timestamp }}"
    
    # 系统检测变量
    total_memory_gb: "{{ (ansible_memtotal_mb / 1024) | round | int }}"
    cpu_cores: "{{ ansible_processor_vcpus }}"
    
    # 根据内存大小动态调整参数
    conn_queue_size: >-
      {%- if total_memory_gb <= 8 -%}
        8192
      {%- elif total_memory_gb <= 32 -%}
        16384
      {%- else -%}
        32768
      {%- endif -%}
    
    file_max: >-
      {%- if total_memory_gb <= 8 -%}
        65536
      {%- elif total_memory_gb <= 32 -%}
        131072
      {%- else -%}
        262144
      {%- endif -%}
    
    shmmax_ratio: >-
      {%- if total_memory_gb <= 8 -%}
        0.5
      {%- elif total_memory_gb <= 32 -%}
        0.6
      {%- else -%}
        0.75
      {%- endif -%}
    
    # 计算共享内存大小
    shmmax_bytes: "{{ ((ansible_memtotal_mb * 1024 * 1024 * (shmmax_ratio | float)) | round | int) if ((ansible_memtotal_mb * 1024 * 1024 * (shmmax_ratio | float)) | round | int) < 68719476736 else 68719476736 }}"
    
    # 文件描述符限制
    nofile_limit: >-
      {%- if total_memory_gb <= 8 -%}
        16384
      {%- elif total_memory_gb <= 32 -%}
        32768
      {%- else -%}
        65536
      {%- endif -%}
    
    nproc_limit: >-
      {%- if total_memory_gb <= 8 -%}
        8192
      {%- elif total_memory_gb <= 32 -%}
        16384
      {%- else -%}
        32768
      {%- endif -%}


  tasks:
    - name: 要求内核优化目标为 Linux
      ansible.builtin.assert:
        that:
          - ansible_facts.system == 'Linux'
        fail_msg: "内核优化只允许用于 Linux 目标，不能在 macOS 控制端执行。"

    - name: 验证 I/O 队列参数
      ansible.builtin.assert:
        that:
          - mysql_kernel_io_queue_depth_ssd | string is match('^[0-9]+$')
          - mysql_kernel_io_queue_depth_hdd | string is match('^[0-9]+$')
          - mysql_kernel_io_queue_depth_ssd | int > 0
          - mysql_kernel_io_queue_depth_hdd | int > 0
        fail_msg: "I/O 队列深度必须是正整数。"

    - name: 显示内核优化开始信息
      debug:
        msg: |
          ==========================================
          MySQL内核优化 - 行业最佳实践版本
          ==========================================
          服务器: {{ inventory_hostname }}
          版本: {{ script_version }}
          优化级别: {{ optimization_level }}
          系统规格: {{ cpu_cores }}核 {{ total_memory_gb }}GB
          连接队列: {{ conn_queue_size }}
          文件描述符: {{ file_max }}
          文件句柄限制: {{ nofile_limit }}

    - name: 初始化内核操作目标地址
      ansible.builtin.set_fact:
        kernel_target_addresses: []
      run_once: true

    - name: 收集内核操作目标地址
      ansible.builtin.set_fact:
        kernel_target_addresses: "{{ kernel_target_addresses + [hostvars[item].ansible_host | default(item) | lower] }}"
      loop: "{{ ansible_play_hosts_all }}"
      run_once: true

    - name: 拒绝多别名并行修改同一主机内核
      ansible.builtin.assert:
        that:
          - kernel_target_addresses | unique | length == kernel_target_addresses | length
        fail_msg: "内核目标存在重复部署地址，请使用每台主机唯一的 inventory 名称。"
      run_once: true

    # 完成备份后才开始修改；备份目录不能位于被复制的源目录内。
    - name: 检查内核备份根目录
      ansible.builtin.assert:
        that:
          - mysql_kernel_backup_root is match('^/var/backups/[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$')
          - "'..' not in mysql_kernel_backup_root.split('/')"
        fail_msg: "mysql_kernel_backup_root 必须位于 /var/backups/ 下。"

    - name: 解析内核备份根目录实际位置
      ansible.builtin.command:
        argv: [realpath, -m, --, "{{ mysql_kernel_backup_root }}"]
      register: kernel_backup_realpath
      changed_when: false

    - name: 解析 sysctl 源目录实际位置
      ansible.builtin.command:
        argv: [realpath, -m, --, /etc/sysctl.d]
      register: kernel_sysctl_realpath
      changed_when: false

    - name: 禁止备份目录落入配置源目录
      ansible.builtin.assert:
        that:
          - kernel_backup_realpath.stdout != kernel_sysctl_realpath.stdout
          - not kernel_backup_realpath.stdout.startswith(kernel_sysctl_realpath.stdout ~ '/')
        fail_msg: "内核备份目录解析到了被备份的 sysctl.d 内部。"

    - name: 检查内核备份根目录状态
      ansible.builtin.stat:
        path: "{{ mysql_kernel_backup_root }}"
        follow: false
      register: kernel_backup_root_stat

    - name: 拒绝备份根目录符号链接或普通文件
      ansible.builtin.assert:
        that:
          - >-
            not kernel_backup_root_stat.stat.exists
            or (kernel_backup_root_stat.stat.isdir | default(false)
                and not kernel_backup_root_stat.stat.islnk | default(false))
        fail_msg: "内核备份根目录必须是实际目录，不能是符号链接或普通文件。"

    - name: 创建内核备份根目录
      ansible.builtin.file:
        path: "{{ mysql_kernel_backup_root }}"
        state: directory
        mode: '0700'

    - name: 检查本轮备份目录是否已存在
      ansible.builtin.stat:
        path: "{{ backup_dir }}"
        follow: false
      register: kernel_backup_run_stat

    - name: 拒绝覆盖已有内核备份
      ansible.builtin.assert:
        that:
          - not kernel_backup_run_stat.stat.exists
        fail_msg: "本轮备份目录已经存在，请保留旧备份后重新执行，不能覆盖。"

    - name: 创建备份目录
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'

    - name: 检查待备份配置是否存在
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/sysctl.conf
        - /etc/security/limits.conf
        - /etc/sysctl.d
      register: kernel_backup_sources

    - name: 备份已有内核配置（失败则停止）
      ansible.builtin.copy:
        src: "{{ item.item }}{{ '/' if item.stat.isdir | default(false) else '' }}"
        dest: "{{ backup_dir }}/{{ item.item | basename }}"
        remote_src: true
        mode: preserve
      loop: "{{ kernel_backup_sources.results }}"
      when: item.stat.exists

    - name: 记录当前参数值
      shell: |
        cat > {{ (backup_dir ~ '/current_values.txt') | quote }} << EOF
        # 当前系统参数值 - 备份时间: $(date)
        net.core.somaxconn = $(sysctl -n net.core.somaxconn 2>/dev/null || echo "未设置")
        fs.file-max = $(sysctl -n fs.file-max 2>/dev/null || echo "未设置")
        vm.swappiness = $(sysctl -n vm.swappiness 2>/dev/null || echo "未设置")
        vm.dirty_ratio = $(sysctl -n vm.dirty_ratio 2>/dev/null || echo "未设置")
        EOF

    # 检测系统信息
    - name: 显示系统信息
      debug:
        msg: |
          ==========================================
          系统环境信息:
          ==========================================
          服务器: {{ inventory_hostname }}
          操作系统: {{ ansible_os_family }} {{ ansible_distribution_version }}
          内核版本: {{ ansible_kernel }}
          CPU核数: {{ cpu_cores }}
          内存大小: {{ total_memory_gb }}GB
          磁盘信息: {{ ansible_devices.keys() | list | join(', ') }}
          
          ==========================================
          动态优化参数:
          ==========================================
          连接队列大小: {{ conn_queue_size }}
          文件描述符上限: {{ file_max }}
          共享内存上限: {{ (shmmax_bytes | int / 1024 / 1024 / 1024) | round(2) }}GB
          用户文件句柄: {{ nofile_limit }}

    # 检查BBR支持
    - name: 检查BBR模块支持
      shell: "modprobe tcp_bbr"
      register: bbr_support
      ignore_errors: yes

    - name: 加载BBR模块
      lineinfile:
        path: /etc/modules-load.d/bbr.conf
        line: "tcp_bbr"
        create: yes
      when: bbr_support.rc == 0

    - name: BBR不支持时调整配置
      set_fact:
        mysql_kernel_params_stable: "{{ mysql_kernel_params_stable | combine({'net.ipv4.tcp_congestion_control': 'cubic'}) }}"
      when: bbr_support.rc != 0

    - name: 显示TCP拥塞控制算法状态
      debug:
        msg: |
          TCP拥塞控制算法: {{ mysql_kernel_params_stable['net.ipv4.tcp_congestion_control'] }}
          {% if bbr_support.rc == 0 %}
          ✅ BBR算法可用，已配置使用
          {% else %}
          ⚠️ BBR算法不可用，使用cubic算法
          {% endif %}

    - name: 读取当前全局文件句柄上限
      ansible.builtin.command:
        argv: [sysctl, -n, "{{ item }}"]
      loop: [fs.file-max, fs.nr_open]
      register: kernel_file_limits_current
      changed_when: false

    - name: 全局文件句柄上限只提高不降低
      ansible.builtin.set_fact:
        mysql_kernel_params_stable: >-
          {{ mysql_kernel_params_stable | combine({item.item:
             [mysql_kernel_params_stable[item.item] | int, item.stdout | int] | max}) }}
      loop: "{{ kernel_file_limits_current.results }}"

    # 应用内核参数优化
    - name: 创建MySQL稳定内核优化配置文件
      template:
        src: mysql-kernel-optimization-stable.conf.j2
        dest: /etc/sysctl.d/99-mysql-stable-optimization.conf
        mode: '0644'
        backup: yes
      register: sysctl_config

    - name: 将受管参数从旧 sysctl.conf 迁移到单一配置文件
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        state: absent
        sysctl_file: /etc/sysctl.conf
        reload: false
      loop: "{{ (mysql_kernel_params_stable | dict2items) + [{'key': 'kernel.sched_migration_cost_ns'}] }}"

    - name: 应用内核参数
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-mysql-stable-optimization.conf
        sysctl_set: true
        reload: false
      loop: "{{ mysql_kernel_params_stable | dict2items }}"

    # 系统资源限制优化
    - name: 更新系统资源限制
      community.general.pam_limits:
        domain: "{{ item.domain }}"
        limit_type: "{{ item.type }}"
        limit_item: "{{ item.item }}"
        value: "{{ item.value }}"
      loop: "{{ mysql_limits_stable }}"

    # 禁用透明大页
    - name: 检查透明大页状态
      stat:
        path: /sys/kernel/mm/transparent_hugepage/enabled
      register: thp_enabled

    - name: 立即禁用透明大页
      ansible.builtin.shell: |
        set -e
        for target in enabled defrag; do
          path="/sys/kernel/mm/transparent_hugepage/$target"
          if [ -f "$path" ] && ! grep -q '\[never\]' "$path"; then
            printf '%s\n' never > "$path"
            echo "CHANGED: $target"
          fi
        done
      register: thp_apply
      changed_when: "'CHANGED:' in thp_apply.stdout"
      when: thp_enabled.stat.exists

    - name: 创建禁用透明大页的systemd服务
      copy:
        dest: /etc/systemd/system/disable-thp-stable.service
        mode: '0644'
        content: |
          [Unit]
          Description=Disable Transparent Huge Pages (THP) for MySQL (Stable)
          ConditionPathExists=/sys/kernel/mm/transparent_hugepage/enabled
          Documentation=https://dev.mysql.com/doc/refman/8.0/en/large-page-support.html
          DefaultDependencies=false
          After=sysinit.target local-fs.target
          Before=mysql.service mysqld.service mariadb.service

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -ec 'echo never > /sys/kernel/mm/transparent_hugepage/enabled; if [ -f /sys/kernel/mm/transparent_hugepage/defrag ]; then echo never > /sys/kernel/mm/transparent_hugepage/defrag; fi'
          RemainAfterExit=yes

          [Install]
          WantedBy=basic.target
      register: thp_service

    - name: 启用禁用透明大页服务
      systemd:
        name: disable-thp-stable
        enabled: yes
        daemon_reload: yes

    # I/O 调度器配置与校验共用同一脚本，持久文件不嵌入执行时间。
    - name: 创建I/O调度器优化脚本
      ansible.builtin.template:
        src: optimize-io-stable.sh.j2
        dest: /usr/local/bin/optimize-io-stable.sh
        mode: '0755'
      register: io_script

    - name: 创建I/O优化systemd服务
      copy:
        dest: /etc/systemd/system/optimize-io-stable.service
        mode: '0644'
        content: |
          [Unit]
          Description=Optimize I/O scheduler for MySQL database servers (Stable)
          DefaultDependencies=false
          After=sysinit.target local-fs.target
          Before=mysql.service mysqld.service mariadb.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/optimize-io-stable.sh
          RemainAfterExit=yes
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
      register: io_service

    - name: 启用I/O优化服务
      systemd:
        name: optimize-io-stable
        enabled: yes
        daemon_reload: yes

    - name: 立即执行I/O优化脚本
      ansible.builtin.command: /usr/local/bin/optimize-io-stable.sh
      register: io_apply
      changed_when: "'CHANGED:' in io_apply.stdout"

    # 创建崩溃转储目录
    - name: 创建核心转储目录
      file:
        path: /var/crash
        state: directory
        mode: '0755'

    # 验证优化效果
    - name: 验证关键内核参数
      ansible.builtin.command:
        argv: [sysctl, -n, "{{ item.key }}"]
      changed_when: false
      loop: "{{ mysql_kernel_params_stable | dict2items }}"
      register: sysctl_verify

    - name: 要求运行值与期望内核参数一致
      ansible.builtin.assert:
        that:
          - (item.stdout | split | join(' ')) == (item.item.value | string | split | join(' '))
        fail_msg: "内核参数 {{ item.item.key }} 运行值与期望值不一致。"
      loop: "{{ sysctl_verify.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: 验证透明大页状态
      shell: "cat /sys/kernel/mm/transparent_hugepage/enabled"
      register: thp_status
      changed_when: false
      failed_when: false

    - name: 要求存在 THP 接口时实际选中 never
      ansible.builtin.assert:
        that:
          - thp_status.rc == 0
          - "'[never]' in thp_status.stdout"
        fail_msg: "THP 接口存在，但未实际禁用，请检查 sysfs 写入权限与错误日志。"
      when: thp_enabled.stat.exists

    - name: 验证磁盘调度器
      ansible.builtin.command: /usr/local/bin/optimize-io-stable.sh --check
      register: scheduler_status
      changed_when: false

    - name: 验证持久化服务已启用
      ansible.builtin.command:
        argv: [systemctl, is-enabled, "{{ item }}"]
      loop: [disable-thp-stable, optimize-io-stable]
      register: kernel_units_enabled
      changed_when: false

    # 生成优化报告
    - name: 生成内核优化报告
      template:
        src: optimization-report-stable.txt.j2
        dest: "/root/mysql_kernel_optimization_stable_report_{{ inventory_hostname }}_{{ backup_timestamp }}.txt"
        mode: '0644'

    - name: 显示内核配置验证结果
      ansible.builtin.debug:
        msg: |
          内核配置已应用并核对运行值：{{ sysctl_verify.results | length }} 项。
          THP: {{ '已选中 never' if thp_status.rc == 0 and '[never]' in thp_status.stdout else '当前环境无可用 THP 接口' }}
          持久化服务已确认启用：disable-thp-stable、optimize-io-stable。
          sysctl 配置: /etc/sysctl.d/99-mysql-stable-optimization.conf
          备份目录: {{ backup_dir }}
          报告: /root/mysql_kernel_optimization_stable_report_{{ inventory_hostname }}_{{ backup_timestamp }}.txt
          请在维护窗口重启后复核持久化状态；本次结果不代表性能容量验收。

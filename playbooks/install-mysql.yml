---
- name: 安装MySQL服务器
  any_errors_fatal: true
  hosts: mysql_cluster
  become: yes
  gather_facts: yes
  serial: "{{ scale_policy.rolling_apply_batch_size | default(1) }}"
  vars:
    mysql_service_name: "{{ 'mysqld' if ansible_os_family == 'RedHat' else 'mysql' }}"
    mysql_config_file: "{{ '/etc/my.cnf' if ansible_os_family == 'RedHat' else '/etc/mysql/mysql.conf.d/zz-innodb-cluster.cnf' }}"
    mysql_socket_path: "{{ mysql_datadir }}/mysql.sock"
    mysql_default_datadir: "/var/lib/mysql"
    mysql_default_socket_path: >-
      {{
        '/var/lib/mysql/mysql.sock'
        if ansible_os_family == 'RedHat'
        else '/var/run/mysqld/mysqld.sock'
      }}
    mysql_error_log_path: "{{ '/var/log/mysqld.log' if ansible_os_family == 'RedHat' else '/var/log/mysql/error.log' }}"
    mysql_release_apt_components: "{{ 'mysql-8.0 mysql-tools' if mysql_release_line == '8.0' else 'mysql-8.4-lts mysql-tools' }}"
    mysql_release_yum_server_repo_name: "{{ 'mysql80-community' if mysql_release_line == '8.0' else 'mysql-84-lts-community' }}"
    mysql_release_yum_server_baseurl: "{{ 'https://repo.mysql.com/yum/mysql-8.0-community/el/' ~ ansible_distribution_major_version ~ '/$basearch/' if mysql_release_line == '8.0' else 'https://repo.mysql.com/yum/mysql-8.4-community/el/' ~ ansible_distribution_major_version ~ '/$basearch/' }}"
    mysql_release_yum_tools_repo_name: "{{ 'mysql-tools-community' if mysql_release_line == '8.0' else 'mysql-tools-84-lts-community' }}"
    mysql_release_yum_tools_baseurl: "{{ 'https://repo.mysql.com/yum/mysql-tools-community/el/' ~ ansible_distribution_major_version ~ '/$basearch/' if mysql_release_line == '8.0' else 'https://repo.mysql.com/yum/mysql-tools-8.4-community/el/' ~ ansible_distribution_major_version ~ '/$basearch/' }}"
    mysql_common_packages_redhat:
      - wget
      - "{{ 'curl-minimal' if 'curl-minimal' in ansible_facts.packages else 'curl' }}"
      - libaio
      - numactl
      - "{{ 'python39' if ansible_distribution_major_version == '8' else 'python3' }}"
      - "{{ 'python39-PyMySQL' if ansible_distribution_major_version == '8' else 'python3-PyMySQL' }}"
      - policycoreutils-python-utils
      - rsync
    mysql_common_packages_debian:
      - wget
      - curl
      - "{{ mysql_libaio_package }}"
      - numactl
      - gnupg
      - python3
      - python3-pymysql
      - rsync
    mysql_libaio_package: >-
      {{
        'libaio1'
        if (
          (ansible_distribution == 'Ubuntu' and ansible_distribution_release == 'jammy')
          or (ansible_distribution == 'Debian' and ansible_distribution_release == 'bookworm')
        )
        else 'libaio1t64'
      }}
    mysql_server_packages_redhat:
      - mysql-community-server
      - mysql-community-client
      - mysql-shell
    mysql_server_packages_debian:
      - mysql-server
      - mysql-shell
  tasks:
    - name: 验证 MySQL 通告地址格式
      ansible.builtin.assert:
        that:
          - mysql_report_host is string
          - mysql_report_host | length <= 253
          - mysql_report_host == '' or mysql_report_host is match('^[A-Za-z0-9_.-]+\\Z')
        fail_msg: "mysql_report_host 必须为空，或不含端口/空白的 IPv4 地址或 DNS 名称。"

    - name: 验证目标操作系统受支持
      assert:
        that:
          - mysql_release_line in mysql_supported_release_lines
          - >
            (ansible_os_family == 'RedHat' and ansible_distribution_major_version in mysql_supported_redhat_major_versions)
            or
            (ansible_distribution == 'Ubuntu' and ansible_distribution_release in mysql_supported_ubuntu_releases)
            or
            (ansible_distribution == 'Debian' and ansible_distribution_release in mysql_supported_debian_releases)
        fail_msg: "目标系统或 MySQL 发行线不在支持配置列表中，请核对 mysql_supported_*；真实环境兼容性须另行验收。"
        success_msg: "目标操作系统在支持配置列表内"

    - name: 显示系统信息
      debug:
        msg: |
          主机: {{ inventory_hostname }}
          系统: {{ ansible_distribution }} {{ ansible_distribution_version }}
          架构: {{ ansible_architecture }}
          服务名: {{ mysql_service_name }}
          配置文件: {{ mysql_config_file }}

    - name: 收集已安装软件包
      ansible.builtin.package_facts:
        manager: auto

    - name: 检测 MariaDB Server 软件包
      ansible.builtin.set_fact:
        mysql_detected_mariadb_server_packages: >-
          {{
            ansible_facts.packages.keys()
            | select('match', '^(MariaDB-server|mariadb-server)(-|$)')
            | list
          }}

    - name: 检测到 MariaDB 时中止普通部署
      ansible.builtin.assert:
        that:
          - mysql_detected_mariadb_server_packages | length == 0
        fail_msg: >-
          检测到 MariaDB Server 软件包
          {{ mysql_detected_mariadb_server_packages | join(', ') }}。
          普通部署不会自动停止、purge 或迁移现有数据库；
          请先完成独立备份、迁移和回滚评审。
        success_msg: "未检测到 MariaDB Server 冲突"

    - name: 安装必要的系统包（RedHat）
      package:
        name: "{{ mysql_common_packages_redhat }}"
        state: present
      when: ansible_os_family == 'RedHat'

    - name: 安装必要的系统包（Debian）
      apt:
        name: "{{ mysql_common_packages_debian }}"
        state: present
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: 创建 MySQL 仓库密钥目录
      ansible.builtin.file:
        path: /etc/mysql-repo-keys
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 下载并校验 MySQL 仓库密钥
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ item.path }}"
        checksum: "sha256:{{ item.sha256 }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ mysql_repo_gpg_keys }}"

    - name: 配置 MySQL YUM 仓库（RedHat）
      yum_repository:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        baseurl: "{{ item.baseurl }}"
        enabled: yes
        gpgcheck: yes
        repo_gpgcheck: no
        gpgkey: "{{ mysql_repo_gpg_keys | map(attribute='file_url') | list }}"
      loop:
        - name: "{{ mysql_release_yum_server_repo_name }}"
          description: MySQL {{ mysql_repo_series }} Server
          baseurl: "{{ mysql_release_yum_server_baseurl }}"
        - name: "{{ mysql_release_yum_tools_repo_name }}"
          description: MySQL {{ mysql_repo_series }} Tools
          baseurl: "{{ mysql_release_yum_tools_baseurl }}"
      when: ansible_os_family == 'RedHat'

    - name: 禁用 RedHat 系统自带 MySQL 模块
      command: "dnf -y module disable mysql"
      when: ansible_os_family == 'RedHat'
      register: dnf_module_disable
      changed_when: "'Nothing to do.' not in (dnf_module_disable.stdout | default(''))"
      failed_when: false

    - name: 配置 MySQL APT 仓库
      copy:
        dest: /etc/apt/sources.list.d/mysql.list
        mode: '0644'
        content: |
          deb [signed-by={{ mysql_repo_gpg_keys[-1].path }}] https://repo.mysql.com/apt/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} {{ mysql_release_apt_components }}
      when: ansible_os_family == 'Debian'

    - name: 更新 APT 缓存
      apt:
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: 安装 MySQL 服务端组件（RedHat）
      package:
        name: "{{ mysql_server_packages_redhat }}"
        state: present
      when: ansible_os_family == 'RedHat'

    - name: 安装 MySQL 服务端组件（Debian/Ubuntu）
      apt:
        name: "{{ mysql_server_packages_debian }}"
        state: present
        update_cache: no
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: ansible_os_family == 'Debian'

    - name: 确保发行包完成首次初始化
      ansible.builtin.systemd_service:
        name: "{{ mysql_service_name }}"
        state: started
        enabled: true

    - name: 创建 MySQL 运行目录
      file:
        path: /var/run/mysqld
        state: directory
        owner: "{{ mysql_user }}"
        group: "{{ mysql_group }}"
        mode: '0755'

    - name: 创建MySQL日志目录
      file:
        path: "{{ mysql_logdir }}"
        state: directory
        owner: "{{ mysql_user }}"
        group: "{{ mysql_group }}"
        mode: '0755'

    - name: 创建MySQL数据目录
      file:
        path: "{{ mysql_datadir }}"
        state: directory
        owner: "{{ mysql_user }}"
        group: "{{ mysql_group }}"
        mode: '0750'

    - name: 检查目标 datadir 是否已初始化
      ansible.builtin.stat:
        path: "{{ mysql_datadir }}/mysql"
      register: mysql_target_system_database

    - name: 检查已有集群元数据目录
      ansible.builtin.stat:
        path: "{{ item }}/mysql_innodb_cluster_metadata"
      loop: "{{ [mysql_datadir, mysql_default_datadir] | unique | list }}"
      register: mysql_metadata_directories

    - name: 记录已有集群身份状态
      ansible.builtin.set_fact:
        mysql_has_cluster_metadata: "{{ mysql_metadata_directories.results | selectattr('stat.exists') | list | length > 0 }}"

    - name: 检查已有 MySQL 本地 socket
      ansible.builtin.stat:
        path: "{{ mysql_socket_path }}"
      register: mysql_existing_socket
      when: mysql_has_cluster_metadata | bool

    - name: 读取已有成员的通告地址
      ansible.mysql.mysql_query:
        login_user: "{{ mysql_cluster_user }}"
        login_password: "{{ mysql_cluster_password }}"
        login_unix_socket: "{{ mysql_socket_path if mysql_existing_socket.stat.issock | default(false) else mysql_default_socket_path }}"
        query: "SELECT @@GLOBAL.report_host AS report_host, @@GLOBAL.hostname AS hostname"
      register: mysql_existing_report_address
      changed_when: false
      no_log: true
      when: mysql_has_cluster_metadata | bool

    - name: 拒绝在普通部署中改变已有成员通告地址
      ansible.builtin.assert:
        that:
          - >-
            mysql_report_host == '' or
            mysql_report_host | lower ==
            (mysql_existing_report_address.query_result[0][0].report_host or
             mysql_existing_report_address.query_result[0][0].hostname) | lower
        fail_msg: >-
          mysql_report_host 与已有成员的实际通告地址不同。
          普通部署不会迁移已注册的成员地址；请保留当前值，按独立维护方案处理地址变更。
      when: mysql_has_cluster_metadata | bool

    - name: 保留已有成员通告地址或采用新实例配置
      ansible.builtin.set_fact:
        mysql_effective_report_host: >-
          {{ mysql_report_host if mysql_report_host | length > 0 else
             ((mysql_existing_report_address.query_result[0][0].report_host or
               mysql_existing_report_address.query_result[0][0].hostname)
              if mysql_has_cluster_metadata | bool else ansible_facts.nodename) }}

    - name: 验证最终通告地址不含配置控制字符
      ansible.builtin.assert:
        that:
          - mysql_effective_report_host == '' or mysql_effective_report_host is match('^[A-Za-z0-9_.:-]+\\Z')
        fail_msg: "已有通告地址包含不安全字符，拒绝写入 my.cnf。"

    - name: 检查 datadir 迁移中断标记
      ansible.builtin.stat:
        path: "{{ mysql_datadir }}/.ansible-datadir-migration-in-progress"
      register: mysql_datadir_migration_in_progress

    - name: 计算 datadir 迁移状态
      ansible.builtin.set_fact:
        mysql_datadir_migration_required: >-
          {{
            mysql_datadir != mysql_default_datadir
            and (
              not mysql_target_system_database.stat.exists
              or mysql_datadir_migration_in_progress.stat.exists
            )
          }}

    - name: 检查发行包默认 datadir 是否已初始化
      ansible.builtin.stat:
        path: "{{ mysql_default_datadir }}/mysql"
      register: mysql_default_system_database

    - name: 检查未初始化目标 datadir 的现有内容
      ansible.builtin.find:
        paths: "{{ mysql_datadir }}"
        file_type: any
        hidden: true
        recurse: false
      register: mysql_target_datadir_contents
      when:
        - mysql_datadir != mysql_default_datadir
        - not mysql_target_system_database.stat.exists

    - name: 拒绝覆盖非空且未初始化的目标 datadir
      ansible.builtin.assert:
        that:
          - mysql_target_datadir_contents.matched | int == 0
        fail_msg: >-
          {{ mysql_datadir }} 非空但未发现 MySQL system database。
          为避免覆盖未知数据，自动迁移已中止。
      when:
        - mysql_datadir != mysql_default_datadir
        - not mysql_target_system_database.stat.exists
        - not mysql_datadir_migration_in_progress.stat.exists

    - name: 要求自定义 datadir 具备可迁移的初始化来源
      ansible.builtin.assert:
        that:
          - mysql_default_system_database.stat.exists
        fail_msg: >-
          发行包默认 datadir {{ mysql_default_datadir }} 未完成初始化，
          无法安全迁移到 {{ mysql_datadir }}。
      when:
        - mysql_datadir_migration_required | bool

    - name: 写入 datadir 迁移中断恢复标记
      ansible.builtin.copy:
        dest: "{{ mysql_datadir }}/.ansible-datadir-migration-in-progress"
        content: "managed by Ansible; safe to resume rsync\n"
        owner: root
        group: root
        mode: '0600'
      when: mysql_datadir_migration_required | bool

    - name: 迁移前停止 MySQL
      ansible.builtin.systemd_service:
        name: "{{ mysql_service_name }}"
        state: stopped
      when:
        - mysql_datadir_migration_required | bool

    - name: 将发行包初始化数据迁移到目标 datadir
      ansible.builtin.command:
        argv:
          - rsync
          - -aHAX
          - --numeric-ids
          - "{{ mysql_default_datadir }}/"
          - "{{ mysql_datadir }}/"
      when:
        - mysql_datadir_migration_required | bool

    - name: 收敛目标 datadir 权限
      ansible.builtin.file:
        path: "{{ mysql_datadir }}"
        state: directory
        owner: "{{ mysql_user }}"
        group: "{{ mysql_group }}"
        recurse: true
      when:
        - mysql_datadir_migration_required | bool

    - name: 验证迁移后的 MySQL system database
      ansible.builtin.stat:
        path: "{{ mysql_datadir }}/mysql"
      register: mysql_migrated_system_database
      when: mysql_datadir_migration_required | bool

    - name: 要求 datadir 迁移结果完整
      ansible.builtin.assert:
        that:
          - mysql_migrated_system_database.stat.exists
          - mysql_migrated_system_database.stat.isdir
        fail_msg: "datadir 迁移后未发现完整的 mysql system database。"
      when: mysql_datadir_migration_required | bool

    - name: 写入 datadir 迁移完成标记
      ansible.builtin.copy:
        dest: "{{ mysql_datadir }}/.ansible-datadir-migration-complete"
        content: "migration completed by Ansible\n"
        owner: root
        group: root
        mode: '0600'
      when: mysql_datadir_migration_required | bool

    - name: 清理 datadir 迁移中断标记
      ansible.builtin.file:
        path: "{{ mysql_datadir }}/.ansible-datadir-migration-in-progress"
        state: absent
      when: mysql_datadir_migration_required | bool

    - name: 确保 Debian MySQL 配置目录存在
      file:
        path: /etc/mysql/mysql.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: ansible_os_family == 'Debian'

    - name: 检查 AppArmor MySQL 配置文件（Debian/Ubuntu）
      stat:
        path: /etc/apparmor.d/usr.sbin.mysqld
      register: mysql_apparmor_profile
      when: ansible_os_family == 'Debian'

    - name: 确保 AppArmor local 目录存在（Debian/Ubuntu）
      file:
        path: /etc/apparmor.d/local
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - ansible_os_family == 'Debian'
        - mysql_apparmor_profile.stat.exists | default(false)

    - name: 配置 AppArmor 允许自定义 datadir（Debian/Ubuntu）
      copy:
        dest: /etc/apparmor.d/local/usr.sbin.mysqld
        owner: root
        group: root
        mode: '0644'
        content: |
          {{ mysql_datadir }}/ r,
          {{ mysql_datadir }}/** rwk,
          {{ mysql_logdir }}/ r,
          {{ mysql_logdir }}/** rw,
      notify: reload apparmor
      when:
        - ansible_os_family == 'Debian'
        - mysql_apparmor_profile.stat.exists | default(false)

    - name: 持久配置 MySQL SELinux 文件上下文（RedHat）
      ansible.builtin.shell: |
        set -euo pipefail
        if semanage fcontext -l -C |
          awk -v target="$SEMANAGE_TARGET" -v setype="$SEMANAGE_TYPE" '
            $1 == target && index($NF, ":" setype ":") { found = 1 }
            END { exit(found ? 0 : 1) }
          '
        then
          exit 0
        fi
        if semanage fcontext -a -t "$SEMANAGE_TYPE" "$SEMANAGE_TARGET"; then
          exit 42
        fi
        semanage fcontext -m -t "$SEMANAGE_TYPE" "$SEMANAGE_TARGET"
        exit 42
      args:
        executable: /bin/bash
      environment:
        SEMANAGE_TARGET: "{{ item.target }}"
        SEMANAGE_TYPE: "{{ item.setype }}"
      register: mysql_semanage_fcontext
      changed_when: mysql_semanage_fcontext.rc == 42
      failed_when: mysql_semanage_fcontext.rc not in [0, 42]
      loop:
        - target: "{{ mysql_datadir | regex_escape }}(/.*)?"
          setype: mysqld_db_t
        - target: "{{ mysql_logdir | regex_escape }}(/.*)?"
          setype: mysqld_log_t
      when:
        - ansible_os_family == 'RedHat'
        - ansible_selinux.status | default('disabled') == 'enabled'

    - name: 应用 MySQL SELinux 文件上下文（RedHat）
      ansible.builtin.command:
        argv:
          - restorecon
          - -Rv
          - "{{ mysql_datadir }}"
          - "{{ mysql_logdir }}"
      register: mysql_restorecon
      changed_when: mysql_restorecon.stdout | length > 0
      when:
        - ansible_os_family == 'RedHat'
        - ansible_selinux.status | default('disabled') == 'enabled'

    - name: 验证 MySQL 文件句柄目标
      ansible.builtin.assert:
        that:
          - mysql_open_files_limit | string is match('^[1-9][0-9]*$')
          - mysql_open_files_limit | int > 0
        fail_msg: "mysql_open_files_limit 必须是正整数。"

    - name: 读取 MySQL 文件句柄内核上限
      ansible.builtin.command:
        argv: [cat, "/proc/sys/{{ item | replace('.', '/') }}"]
      loop: [fs.nr_open, fs.file-max]
      register: mysql_kernel_file_limits
      changed_when: false

    - name: 要求内核支持 MySQL 文件句柄目标
      ansible.builtin.assert:
        that:
          - item.stdout | int >= mysql_open_files_limit | int
        fail_msg: "{{ item.item }} 小于 mysql_open_files_limit；请先调整主机内核上限。"
      loop: "{{ mysql_kernel_file_limits.results }}"

    - name: 创建 MySQL systemd 配置目录
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ mysql_service_name }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 设置 MySQL systemd 文件句柄上限
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ mysql_service_name }}.service.d/50-innodb-cluster-limits.conf"
        content: |
          [Service]
          LimitNOFILE={{ mysql_open_files_limit | int }}
        owner: root
        group: root
        mode: '0644'
      register: mysql_systemd_limits_config
      notify: restart mysql

    - name: 加载 MySQL systemd 配置
      ansible.builtin.systemd_service:
        daemon_reload: true
      changed_when: false

    - name: 读取 systemd 解析后的 MySQL 文件句柄上限
      ansible.builtin.command:
        argv: [systemctl, show, "{{ mysql_service_name }}", -p, LimitNOFILE, --value]
      register: mysql_systemd_nofile
      changed_when: false

    - name: 读取 systemd 解析后的 MySQL 文件句柄软限制
      ansible.builtin.command:
        argv: [systemctl, show, "{{ mysql_service_name }}", -p, LimitNOFILESoft, --value]
      register: mysql_systemd_nofile_soft
      changed_when: false

    - name: 在重启前拒绝冲突的 systemd 文件句柄配置
      ansible.builtin.assert:
        that:
          - mysql_systemd_nofile.stdout is match('^[1-9][0-9]*$')
          - mysql_systemd_nofile.stdout | int >= mysql_open_files_limit | int
          - mysql_systemd_nofile.stdout | int <= mysql_kernel_file_limits.results[0].stdout | int
          - mysql_systemd_nofile_soft.stdout is match('^[1-9][0-9]*$')
          - mysql_systemd_nofile_soft.stdout | int >= mysql_open_files_limit | int
          - mysql_systemd_nofile_soft.stdout | int <= mysql_systemd_nofile.stdout | int
        fail_msg: "systemd 的 LimitNOFILE 与目标或内核上限冲突，请检查该 MySQL 服务的其他 drop-in。"

    - name: 读取配置应用前的 MySQL 主进程
      ansible.builtin.command:
        argv: [systemctl, show, "{{ mysql_service_name }}", -p, MainPID, --value]
      register: mysql_pre_restart_pid
      changed_when: false
      failed_when: mysql_pre_restart_pid.rc != 0 or not (mysql_pre_restart_pid.stdout is match('^[0-9]+$'))

    - name: 读取已有 MySQL 进程的文件句柄容量
      ansible.builtin.slurp:
        src: "/proc/{{ mysql_pre_restart_pid.stdout }}/limits"
      register: mysql_pre_restart_limits
      when: mysql_pre_restart_pid.stdout | int > 0

    - name: 解析已有 MySQL 进程的文件句柄容量
      ansible.builtin.set_fact:
        mysql_running_nofile: >-
          {{ mysql_pre_restart_limits.content | default('') | b64decode
             | regex_findall('(?m)^Max open files\s+(\d+)\s+(\d+)') }}

    - name: 要求已有 MySQL 进程限制可验证
      ansible.builtin.assert:
        that: mysql_running_nofile | length == 1
        fail_msg: "无法读取已有 mysqld 进程的文件句柄容量。"
      when: mysql_pre_restart_pid.stdout | int > 0

    - name: 让已有进程收敛到文件句柄目标
      ansible.builtin.debug:
        msg: "已有 mysqld 进程限制与 systemd 配置不同，将在当前滚动批次内重启使配置生效。"
      changed_when: true
      when:
        - mysql_pre_restart_pid.stdout | int > 0
        - >-
          mysql_running_nofile[0][0] | int != mysql_systemd_nofile_soft.stdout | int
          or mysql_running_nofile[0][1] | int != mysql_systemd_nofile.stdout | int
      notify: restart mysql

    - name: 配置MySQL配置文件
      template:
        src: ../roles/mysql-server/templates/my.cnf.j2
        dest: "{{ mysql_config_file }}"
        owner: root
        group: root
        mode: '0644'
        backup: yes
      notify: restart mysql

    - name: 在重启前校验 MySQL 配置
      ansible.builtin.command:
        argv:
          - /usr/sbin/mysqld
          - --validate-config
      changed_when: false

    - name: 立即执行配置相关 handlers
      ansible.builtin.meta: flush_handlers

    - name: 启动并启用MySQL服务
      systemd:
        name: "{{ mysql_service_name }}"
        state: started
        enabled: yes

    - name: 等待 MySQL 服务可用
      wait_for:
        port: "{{ mysql_port }}"
        host: "{{ ansible_default_ipv4.address }}"
        delay: 5
        timeout: 180

    - name: 读取运行中的 MySQL 主进程
      ansible.builtin.command:
        argv: [systemctl, show, "{{ mysql_service_name }}", -p, MainPID, --value]
      register: mysql_main_pid
      changed_when: false
      failed_when: mysql_main_pid.rc != 0 or not (mysql_main_pid.stdout is match('^[1-9][0-9]*$'))

    - name: 读取 MySQL 进程实际资源限制
      ansible.builtin.slurp:
        src: "/proc/{{ mysql_main_pid.stdout }}/limits"
      register: mysql_process_limits

    - name: 核对 MySQL 实际文件句柄容量
      ansible.builtin.assert:
        that:
          - mysql_actual_nofile | length == 1
          - mysql_actual_nofile[0][0] | int == mysql_systemd_nofile_soft.stdout | int
          - mysql_actual_nofile[0][1] | int == mysql_systemd_nofile.stdout | int
        fail_msg: "mysqld 进程的实际文件句柄限制与 systemd 配置不一致。"
      vars:
        mysql_actual_nofile: >-
          {{ mysql_process_limits.content | b64decode
             | regex_findall('(?m)^Max open files\s+(\d+)\s+(\d+)') }}

    - name: 探测目标 root 密码是否已生效（RedHat）
      when: ansible_os_family == 'RedHat'
      block:
        - name: 创建目标 root 凭据探测文件
          ansible.builtin.tempfile:
            state: file
            suffix: .cnf
          register: mysql_desired_root_option_file
          no_log: true

        - name: 写入目标 root 凭据探测文件
          ansible.builtin.copy:
            dest: "{{ mysql_desired_root_option_file.path }}"
            mode: '0600'
            content: |
              [client]
              user=root
              password={{ mysql_root_password | to_json(ensure_ascii=False) }}
              socket={{ mysql_socket_path }}
          no_log: true

        - name: 使用目标 root 密码执行无副作用查询
          ansible.builtin.command:
            argv:
              - mysql
              - "--defaults-extra-file={{ mysql_desired_root_option_file.path }}"
              - --batch
              - --skip-column-names
              - --execute=SELECT 1
          register: mysql_desired_root_probe
          changed_when: false
          failed_when: false
          no_log: true
      always:
        - name: 删除目标 root 凭据探测文件
          ansible.builtin.file:
            path: "{{ mysql_desired_root_option_file.path | default('') }}"
            state: absent
          when: mysql_desired_root_option_file.path is defined
          no_log: true

    - name: 获取 MySQL 临时 root 密码（RedHat 首次初始化）
      ansible.builtin.shell: |
        set -o pipefail
        grep -h 'temporary password' \
          /var/log/mysqld.log \
          "{{ mysql_logdir }}/mysqld.log" 2>/dev/null |
          awk '{print $NF}' |
          tail -1
      args:
        executable: /bin/bash
      register: mysql_temp_password
      changed_when: false
      failed_when: false
      when:
        - ansible_os_family == 'RedHat'
        - mysql_desired_root_probe.rc | default(1) != 0
      no_log: true

    - name: 要求 RedHat root 凭据具备可恢复路径
      ansible.builtin.assert:
        that:
          - >-
            mysql_desired_root_probe.rc | default(1) == 0
            or mysql_temp_password.stdout | default('') | length > 0
        fail_msg: >-
          目标 root 密码不可用，且未找到可用的首次初始化临时密码。
          为避免破坏现有实例，部署已中止。
      when: ansible_os_family == 'RedHat'
      no_log: true

    - name: 设置 MySQL root 密码（RedHat 临时密码流程）
      when:
        - ansible_os_family == 'RedHat'
        - mysql_desired_root_probe.rc | default(1) != 0
        - mysql_temp_password.stdout | length > 0
      block:
        - name: 创建临时 MySQL client option 文件
          ansible.builtin.tempfile:
            state: file
            suffix: .cnf
          register: mysql_root_option_file
          no_log: true

        - name: 写入临时 root 凭据
          ansible.builtin.copy:
            dest: "{{ mysql_root_option_file.path }}"
            mode: '0600'
            content: |
              [client]
              user=root
              password={{ mysql_temp_password.stdout | to_json(ensure_ascii=False) }}
              socket={{ mysql_socket_path }}
          no_log: true

        - name: 通过 stdin 更新 root 密码
          ansible.builtin.command:
            argv:
              - mysql
              - "--defaults-extra-file={{ mysql_root_option_file.path }}"
              - --connect-expired-password
            stdin: |
              ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password | replace('\\', '\\\\') | replace("'", "''") }}';
              FLUSH PRIVILEGES;
          no_log: true
      always:
        - name: 删除临时 MySQL client option 文件
          ansible.builtin.file:
            path: "{{ mysql_root_option_file.path | default('') }}"
            state: absent
          when: mysql_root_option_file.path is defined
          no_log: true

    - name: 设置 MySQL root 密码（Debian/Ubuntu socket 流程）
      ansible.mysql.mysql_user:
        check_implicit_admin: true
        login_unix_socket: "{{ mysql_socket_path }}"
        name: root
        host: localhost
        plugin: caching_sha2_password
        plugin_auth_string: "{{ mysql_root_password }}"
        salt: "{{ ((mysql_group_replication_group_name ~ ':' ~ 'root') | hash('sha256'))[:20] }}"
        state: present
      when: ansible_os_family == 'Debian'
      no_log: true

    - name: 收集系统服务状态（RedHat）
      ansible.builtin.service_facts:
      when: ansible_os_family == 'RedHat'

    - name: 配置防火墙规则（firewalld 运行时）
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop: "{{ firewall_ports }}"
      when:
        - ansible_os_family == 'RedHat'
        - "'firewalld.service' in ansible_facts.services"
        - ansible_facts.services['firewalld.service'].state == 'running'

    - name: 判断账号变更应由本机执行还是由集群复制
      ansible.mysql.mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket_path }}"
        config_file: ""
        query: |
          SELECT
            (SELECT COUNT(*) FROM information_schema.schemata
             WHERE schema_name = 'mysql_innodb_cluster_metadata') AS metadata_exists,
            (SELECT COUNT(*) FROM performance_schema.replication_group_members
             WHERE MEMBER_ID = @@server_uuid AND MEMBER_STATE = 'ONLINE'
               AND MEMBER_ROLE = 'PRIMARY') AS is_primary
      register: mysql_account_writer
      changed_when: false
      no_log: true

    - name: 创建集群管理用户
      ansible.mysql.mysql_user:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket_path if ansible_os_family == 'Debian' else omit }}"
        check_implicit_admin: "{{ true if ansible_os_family == 'Debian' else omit }}"
        name: "{{ mysql_cluster_user }}"
        plugin: caching_sha2_password
        plugin_auth_string: "{{ mysql_cluster_password }}"
        salt: "{{ ((mysql_group_replication_group_name ~ ':' ~ mysql_cluster_user) | hash('sha256'))[:20] }}"
        host: "%"
        priv: "*.*:ALL,GRANT"
        state: present
      no_log: true

      when: >-
        mysql_account_writer.query_result[0][0].metadata_exists | int == 0
        or mysql_account_writer.query_result[0][0].is_primary | int == 1

    - name: 创建复制用户
      ansible.mysql.mysql_user:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket_path if ansible_os_family == 'Debian' else omit }}"
        check_implicit_admin: "{{ true if ansible_os_family == 'Debian' else omit }}"
        name: "{{ mysql_replication_user }}"
        plugin: caching_sha2_password
        plugin_auth_string: "{{ mysql_replication_password }}"
        salt: "{{ ((mysql_group_replication_group_name ~ ':' ~ mysql_replication_user) | hash('sha256'))[:20] }}"
        host: "%"
        priv: "*.*:REPLICATION SLAVE"
        state: present
      no_log: true

      when: >-
        mysql_account_writer.query_result[0][0].metadata_exists | int == 0
        or mysql_account_writer.query_result[0][0].is_primary | int == 1

    - name: 读取 MySQL 最终 datadir
      ansible.mysql.mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket_path }}"
        config_file: ""
        query: "SELECT @@datadir AS datadir"
      register: mysql_runtime_datadir
      changed_when: false
      no_log: true

    - name: 要求运行时 datadir 与主配置一致
      ansible.builtin.assert:
        that:
          - >-
            mysql_runtime_datadir.query_result[0][0].datadir
            | regex_replace('/+$', '')
            == mysql_datadir | regex_replace('/+$', '')
        fail_msg: "MySQL 运行时 datadir 与 mysql_datadir 不一致。"
        success_msg: "MySQL 运行时 datadir 已收敛到 {{ mysql_datadir }}"

    - name: 等待现有集群成员恢复 ONLINE
      ansible.mysql.mysql_query:
        login_user: "{{ mysql_cluster_user }}"
        login_password: "{{ mysql_cluster_password }}"
        login_unix_socket: "{{ mysql_socket_path }}"
        config_file: ""
        query: |
          SELECT
            (
              SELECT COUNT(*)
              FROM information_schema.schemata
              WHERE schema_name = 'mysql_innodb_cluster_metadata'
            ) AS metadata_exists,
            (
              SELECT COUNT(*)
              FROM performance_schema.replication_group_members
              WHERE MEMBER_ID = @@server_uuid
                AND MEMBER_STATE = 'ONLINE'
            ) AS member_online
      register: mysql_member_rejoin
      changed_when: false
      retries: 30
      delay: 10
      until: >-
        mysql_member_rejoin.query_result[0][0].metadata_exists | int == 0
        or mysql_member_rejoin.query_result[0][0].member_online | int == 1
      no_log: true

    - name: 滚动批次间暂停
      ansible.builtin.pause:
        seconds: "{{ scale_policy.rolling_apply_pause_seconds | int }}"
      when: scale_policy.rolling_apply_pause_seconds | int > 0

  handlers:
    - name: reload apparmor
      systemd:
        name: apparmor
        state: reloaded

    - name: restart mysql
      systemd:
        name: "{{ mysql_service_name }}"
        state: restarted
        daemon_reload: yes

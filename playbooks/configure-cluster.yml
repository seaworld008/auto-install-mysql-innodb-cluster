---
- name: 校验 MySQL 实例满足 InnoDB Cluster 要求
  hosts: mysql_cluster
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: 等待 MySQL 服务完全启动
      ansible.builtin.wait_for:
        port: "{{ mysql_port }}"
        host: "{{ ansible_default_ipv4.address }}"
        delay: 2
        timeout: 300

    - name: 判断实例是否已是在线集群成员
      ansible.builtin.command:
        argv:
          - mysqlsh
          - --no-wizard
          - --passwords-from-stdin
          - --uri
          - "{{ mysql_cluster_user }}@127.0.0.1:{{ mysql_port }}"
          - --js
          - -e
          - >-
            var row = session.runSql(
              "SELECT COUNT(*) FROM performance_schema.replication_group_members
              WHERE MEMBER_ID = @@server_uuid"
            ).fetchOne();
            print('ANSIBLE_MEMBER=' + row[0]);
        stdin: "{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      register: mysql_cluster_membership
      changed_when: false
      no_log: true

    - name: 检查 standalone 实例配置
      ansible.builtin.command:
        argv:
          - mysqlsh
          - --no-wizard
          - --passwords-from-stdin
          - --uri
          - "{{ mysql_cluster_user }}@127.0.0.1:{{ mysql_port }}"
          - --js
          - -e
          - >-
            var result = dba.checkInstanceConfiguration();
            print('ANSIBLE_STATUS=' + result.status);
        stdin: "{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      register: mysql_instance_configuration
      changed_when: false
      failed_when: false
      no_log: true
      when: "'ANSIBLE_MEMBER=1' not in mysql_cluster_membership.stdout"

    - name: 要求 standalone 实例配置通过检查
      ansible.builtin.assert:
        that:
          - >-
            mysql_instance_configuration.rc == 0
            and 'ANSIBLE_STATUS=ok' in mysql_instance_configuration.stdout
        fail_msg: >-
          {{ inventory_hostname }} 未通过 dba.checkInstanceConfiguration()。
          Ansible 管理的 my.cnf 必须先收敛到可加入集群的状态。
        success_msg: "{{ inventory_hostname }} 已满足 InnoDB Cluster 配置要求"
      when: "'ANSIBLE_MEMBER=1' not in mysql_cluster_membership.stdout"

    - name: 记录现有成员无需重复 configureInstance
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} 已是集群成员，跳过会破坏幂等性的
          dba.configureInstance()。
      when: "'ANSIBLE_MEMBER=1' in mysql_cluster_membership.stdout"

- name: 创建 InnoDB Cluster
  hosts: mysql_primary
  become: true
  gather_facts: false
  tasks:
    - name: 检查集群是否已存在
      ansible.builtin.command:
        argv:
          - mysqlsh
          - --no-wizard
          - --passwords-from-stdin
          - --uri
          - "{{ mysql_cluster_user }}@127.0.0.1:{{ mysql_port }}"
          - --js
          - -e
          - >-
            try {
              dba.getCluster('{{ mysql_cluster_name }}');
              print('ANSIBLE_CLUSTER=EXISTS');
            } catch (err) {
              print('ANSIBLE_CLUSTER=NOT_EXISTS');
            }
        stdin: "{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      register: cluster_exists
      changed_when: false
      no_log: true

    - name: 创建 InnoDB Cluster
      ansible.builtin.command:
        argv:
          - mysqlsh
          - --no-wizard
          - --passwords-from-stdin
          - --uri
          - "{{ mysql_cluster_user }}@127.0.0.1:{{ mysql_port }}"
          - --js
          - -e
          - >-
            dba.createCluster(
              '{{ mysql_cluster_name }}',
              {gtidSetIsComplete: true}
            );
        stdin: "{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      when: "'ANSIBLE_CLUSTER=NOT_EXISTS' in cluster_exists.stdout"
      register: create_cluster_result
      no_log: true

    - name: 显示集群创建结果
      ansible.builtin.debug:
        msg: >-
          InnoDB Cluster
          {{ '已创建' if create_cluster_result is changed else '已存在' }}。

- name: 将 secondary 实例加入集群
  hosts: mysql_secondary
  become: true
  gather_facts: true
  serial: 1
  vars:
    mysql_primary_host: "{{ groups['mysql_primary'][0] }}"
    mysql_instance_address: >-
      {{ ansible_host | default(ansible_default_ipv4.address) }}:{{ mysql_port }}
  tasks:
    - name: 将实例加入集群
      ansible.builtin.command:
        argv:
          - mysqlsh
          - --no-wizard
          - --passwords-from-stdin
          - --uri
          - "{{ mysql_cluster_user }}@127.0.0.1:{{ mysql_port }}"
          - --js
          - -e
          - >-
            dba.getCluster('{{ mysql_cluster_name }}').addInstance(
              '{{ mysql_cluster_user }}@{{ mysql_instance_address }}',
              {recoveryMethod: '{{ mysql_cluster_recovery_method }}'}
            );
        stdin: "{{ mysql_cluster_password }}\n{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      delegate_to: "{{ mysql_primary_host }}"
      when: "'ANSIBLE_MEMBER=1' not in mysql_cluster_membership.stdout"
      register: add_instance_result
      no_log: true

    - name: 显示实例加入结果
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}
          {{ '已加入集群' if add_instance_result is changed else '已在集群中' }}。

- name: 等待集群恢复完整健康状态
  hosts: mysql_primary
  become: true
  gather_facts: false
  vars:
    mysql_expected_members: "{{ groups['mysql_cluster'] | length }}"
  tasks:
    - name: 等待所有 inventory 成员 ONLINE
      ansible.builtin.command:
        argv:
          - mysqlsh
          - --no-wizard
          - --passwords-from-stdin
          - --uri
          - "{{ mysql_cluster_user }}@127.0.0.1:{{ mysql_port }}"
          - --js
          - -e
          - >-
            var status = dba.getCluster(
              '{{ mysql_cluster_name }}'
            ).status().defaultReplicaSet;
            var topology = status.topology;
            var online = Object.keys(topology).filter(
              function(key) { return topology[key].status === 'ONLINE'; }
            ).length;
            print(
              'ANSIBLE_CLUSTER=' + status.status + '|' +
              online + '|' + Object.keys(topology).length
            );
        stdin: "{{ mysql_cluster_password }}\n"
        stdin_add_newline: false
      register: final_cluster_status
      changed_when: false
      retries: 30
      delay: 10
      until: >-
        'ANSIBLE_CLUSTER=OK|'
        ~ (mysql_expected_members | string)
        ~ '|'
        ~ (mysql_expected_members | string)
        in final_cluster_status.stdout
      no_log: true

    - name: 输出集群验证结果
      ansible.builtin.debug:
        msg: >-
          InnoDB Cluster 状态为 OK，{{ mysql_expected_members }}
          个 inventory 成员均为 ONLINE。
